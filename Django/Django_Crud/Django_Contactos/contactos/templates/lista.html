<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contactos</title>
</head>
<body>
    <h1>Listado de Contactos</h1>
    <a href="/contactos/"></a>

    {% for contacto in contactos %}

        <h3>{{ contacto.nombre }}</h3>

        <p>{{ contacto.correo }}</p>

        <p>{{ contacto.mensaje }}</p>

        <a href="/contactos/detalle/{{ contacto.id }}/">Ver</a>

        <a href="/contactos/editar/{{ contacto.id }}/">Editar</a>

        <a href="/contactos/eliminar/{{ contacto.id }}/">Eliminar</a>
        
</body>
</html>
